# fly.toml app configuration file generated for america-music-web on 2026-08-29T17:12:58-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'america-music-web'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  MAX_CONCURRENT_DOWNLOADS = '3'
  NO_BROWSER = '1'
  PORT = '8000'
  TEMP_FILE_TTL_MINUTES = '15'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
