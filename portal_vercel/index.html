<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>América Web — Conversor de YouTube para MP3 & Player</title>
  
  <meta name="description" content="Baixe músicas e playlists do YouTube em MP3 de alta qualidade (320 kbps) diretamente no seu computador ou celular.">
  <meta property="og:title" content="América Web — Conversor de Músicas & MP3">
  <meta property="og:description" content="Baixe músicas e playlists com qualidade máxima de 320 kbps.">
  <meta property="og:type" content="website">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Google Fonts: Poppins & Righteous -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Righteous&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Glow Elements -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Main Reception Card (Centered & Zero Scroll) -->
  <main class="portal-card">
    
    <!-- Online Status Pill -->
    <div class="status-badge" title="Servidor Online">
      <span class="status-dot"></span>
      <span>Sistema Online</span>
    </div>

    <!-- Brand Identity -->
    <div class="brand-wrapper">
      <div class="logo-icon-box">
        <i class="fa-solid fa-music"></i>
      </div>
      <h1 class="brand-title">AMÉRICA WEB</h1>
      <p class="brand-subtitle">
        Conversor de YouTube para MP3 com download de playlists e reprodutor de áudio integrado.
      </p>
    </div>

    <!-- Quick Features -->
    <div class="features-grid">
      <div class="feature-pill">
        <i class="fa-solid fa-bolt"></i>
        <span>320 kbps HD</span>
      </div>
      <div class="feature-pill">
        <i class="fa-solid fa-file-zipper"></i>
        <span>Playlists em ZIP</span>
      </div>
      <div class="feature-pill">
        <i class="fa-solid fa-mobile-screen"></i>
        <span>Celular & PC</span>
      </div>
    </div>

    <!-- Main Enter CTA Button -->
    <a href="https://unpaved-counting-patio.ngrok-free.dev" class="btn-enter-app" id="btnEnterApp">
      <span>Acessar Aplicativo</span>
      <i class="fa-solid fa-arrow-right"></i>
    </a>

    <!-- Footer Note -->
    <div class="portal-footer">
      <i class="fa-solid fa-shield-halved"></i>
      <span>Acesso direto, rápido e gratuito</span>
    </div>

  </main>

</body>
</html>
